openapi: 3.2.0
info:
  title: Meterest Node API
  description: 'RESTful API to access Meter.io


    Project Home'
  license:
    name: LGPL 3.0
    url: https://www.gnu.org/licenses/lgpl-3.0.en.html
  version: 1.2.2
servers:
- url: /
  description: local meter node
tags:
- name: Node
  description: Access to node status info
paths:
  /node/network/peers:
    get:
      tags:
      - Node
      summary: Retrieve connected peers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PeerStats'
      operationId: getNodeNetworkPeers
      x-operation-id-source: derived
  /node/consensus/committee:
    get:
      tags:
      - Node
      summary: Retrieve current committee members
      reponses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: null
      operationId: getNodeConsensusCommittee
      x-operation-id-source: derived
components:
  schemas:
    PeerStats:
      properties:
        name:
          type: string
          example: meter/v1.0.0-6680b98-dev/linux/go1.10.3
        bestBlockID:
          type: string
          example: '0x000087b3a4d4cdf1cc52d56b9704f4c18f020e1b48dbbf4a23d1ee4f1fa5ff94'
        totalScore:
          type: integer
          example: 68497
        peerID:
          type: string
          example: 50e122a505ee55b84331068acfd857e37ad58f463a0fab9aaff2c1e4b2e2d22ae71dc14fdaf6eead74bd3f60594644aa35c588f9ca6be3341e2ce18ddc413321
        netAddr:
          type: string
          example: 128.1.39.120:11235
        inbound:
          type: boolean
          example: false
        duration:
          type: integer
          example: 28
