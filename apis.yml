aid: meter
name: Meter
description: >-
  Meter is a high-performance, EVM-compatible Layer-1 blockchain and cross-chain
  infrastructure network built for the Web3 economy, backed by General Catalyst and
  Pantera Capital. Its HotStuff-based hybrid PoV consensus delivers thousands of TPS with
  instant finality, MEV/censorship resistance, and a metastable gas currency (MTR) pegged
  to energy alongside the MTRG governance token. Developers reach Meter through a standard
  Ethereum JSON-RPC endpoint (rpc.meter.io) that works with web3.js, ethers.js, Hardhat,
  Remix and MetaMask, and through a native RESTful node API ("Meterest") covering accounts,
  blocks, transactions, event/transfer logs, node status, staking and WebSocket subscriptions.
  The Meter Passport bridge provides generic cross-chain messaging and asset transfer, and
  the meterify library gives a web3.js-style adaptor to the native API.
